<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Референсы — Filmway</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#0b0d12; --panel:#12151c; --panel-2:#181c25; --panel-3:#1e232e;
    --border:#242938; --border-soft:#1b202b;
    --text:#eef0f5; --text-dim:#8b93a7; --text-faint:#565e72;
    --accent:#7c9bff; --accent-2:#a78bfa; --accent-dim:#1e2544;
    --radius:16px; --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(124,155,255,.08), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(167,139,250,.06), transparent 45%),
      var(--bg);
    color:var(--text); min-height:100vh;
  }
  header{
    padding:20px 32px; border-bottom:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .mark{
    width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:18px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 4px 18px rgba(124,155,255,.25);
  }
  header h1{font-size:16px; font-weight:700; margin:0; letter-spacing:-.01em;}
  header .sub{color:var(--text-dim); font-size:12.5px; margin-top:2px;}
  .new-btn{
    padding:11px 20px; border-radius:var(--radius-sm); background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#0b0d12; font-size:13.5px; font-weight:700; text-decoration:none;
  }
  .grid{
    display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    max-width:1200px; margin:0 auto; padding:32px;
  }
  .card{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:20px 22px;}
  .card h3{margin:0 0 6px; font-size:15.5px; font-weight:700;}
  .meta{color:var(--text-faint); font-size:11.5px; margin-bottom:12px;}
  .fields{font-size:13px; color:var(--text-dim); line-height:1.75; margin-bottom:12px;}
  .fields b{color:var(--text);}
  .links{display:flex; gap:8px; flex-wrap:wrap;}
  .links a{font-size:12px; color:var(--accent); text-decoration:none; border:1px solid #2a3550; padding:5px 11px; border-radius:8px;}
  .links a:hover{background:var(--accent-dim);}
  .photos{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:6px; margin-top:12px;}
  .photos img{width:100%; height:70px; object-fit:cover; border-radius:6px; border:1px solid var(--border);}
  .empty{color:var(--text-faint); text-align:center; margin-top:100px; font-size:14px; line-height:1.8;}
  .empty .big{font-size:36px; display:block; margin-bottom:14px; opacity:.5;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">🎬</div>
    <div>
      <h1>Референсы — Filmway</h1>
      <div class="sub">Собранные Кадром референс-брифы</div>
    </div>
  </div>
  <a class="new-btn" href="./new.html">+ Новый бриф</a>
</header>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">
  <span class="big">🎬</span>Пока нет ни одного брифа.<br>
  <a href="./new.html" style="color:var(--accent);">Собрать первый →</a>
</div>

<script>
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  try {
    const res = await fetch('./data.json?_=' + Date.now(), {cache:'no-store'});
    const data = await res.json();
    const briefs = (data.briefs || []).slice().sort((a,b) => (b.updated_at||'').localeCompare(a.updated_at||''));
    if(!briefs.length){ empty.style.display = 'block'; return; }
    for(const b of briefs){
      const fields = b.fields || {};
      const links = b.links || {};
      const fieldsHtml = Object.entries(fields).filter(([,v]) => v)
        .map(([k,v]) => `<div><b>${escapeHtml(k)}:</b> ${escapeHtml(v)}</div>`).join('');
      const linksHtml = Object.entries(links)
        .map(([k,v]) => `<a href="${v}" target="_blank" rel="noopener">${escapeHtml(k)} →</a>`).join('');
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${escapeHtml(b.title || b.slug)}</h3>
        <div class="meta">${escapeHtml(b.slug)} · ${escapeHtml(b.updated_at || '')}</div>
        <div class="fields">${fieldsHtml}</div>
        <div class="links">${linksHtml}</div>
      `;
      grid.appendChild(card);
    }
  } catch(e) {
    empty.style.display = 'block';
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
