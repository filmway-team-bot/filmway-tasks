<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Референсы — Filmway</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#0b0d12; --panel:#12151c; --panel-2:#181c25; --panel-3:#1e232e;
    --border:#242938; --border-soft:#1b202b;
    --text:#eef0f5; --text-dim:#8b93a7; --text-faint:#565e72;
    --accent:#7c9bff; --accent-2:#a78bfa; --accent-dim:#1e2544;
    --ok:#3ecf8e; --ok-dim:#122e22; --bad:#f26d6d; --bad-dim:#2e1414;
    --warn:#e7b750; --warn-dim:#2e2712;
    --radius:16px; --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(124,155,255,.08), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(167,139,250,.06), transparent 45%),
      var(--bg);
    color:var(--text); min-height:100vh;
  }
  header{
    padding:20px 32px; border-bottom:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .mark{
    width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:18px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 4px 18px rgba(124,155,255,.25);
  }
  header h1{font-size:16px; font-weight:700; margin:0; letter-spacing:-.01em;}
  header .sub{color:var(--text-dim); font-size:12.5px; margin-top:2px;}
  .new-btn{
    padding:11px 20px; border-radius:var(--radius-sm); background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#0b0d12; font-size:13.5px; font-weight:700; text-decoration:none;
  }
  .grid{
    display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    max-width:1200px; margin:0 auto; padding:32px;
  }
  .card{
    background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:20px 22px;
    cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .card:hover{border-color:#33405e;}
  .card:active{transform:scale(.995);}
  .card h3{margin:0 0 6px; font-size:15.5px; font-weight:700;}
  .meta{color:var(--text-faint); font-size:11.5px; margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .badge{
    display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    padding:3px 8px; border-radius:6px;
  }
  .badge-new{background:var(--accent-dim); color:var(--accent);}
  .badge-clarifying{background:var(--warn-dim); color:var(--warn);}
  .badge-pending_approval{background:var(--warn-dim); color:var(--warn);}
  .badge-approved{background:var(--ok-dim); color:var(--ok);}
  .badge-revision{background:var(--bad-dim); color:var(--bad);}
  .badge-sent{background:var(--ok-dim); color:var(--ok);}
  .fields{font-size:13px; color:var(--text-dim); line-height:1.75; margin-bottom:12px;}
  .fields b{color:var(--text);}
  .links{display:flex; gap:8px; flex-wrap:wrap;}
  .links a{font-size:12px; color:var(--accent); text-decoration:none; border:1px solid #2a3550; padding:5px 11px; border-radius:8px;}
  .links a:hover{background:var(--accent-dim);}
  .hint{color:var(--text-faint); font-size:11.5px; margin-top:12px;}
  .empty{color:var(--text-faint); text-align:center; margin-top:100px; font-size:14px; line-height:1.8;}
  .empty .big{font-size:36px; display:block; margin-bottom:14px; opacity:.5;}

  /* modal */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(6,7,10,.72); backdrop-filter:blur(2px);
    z-index:50; align-items:flex-start; justify-content:center; padding:48px 16px; overflow-y:auto;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius);
    max-width:640px; width:100%; padding:26px 28px 28px; position:relative;
  }
  .modal .close{
    position:absolute; top:18px; right:18px; background:none; border:none; color:var(--text-faint);
    font-size:20px; cursor:pointer; line-height:1; padding:4px;
  }
  .modal .close:hover{color:var(--text);}
  .modal h2{margin:0 0 4px; font-size:18px; font-weight:700; padding-right:30px;}
  .modal .meta{margin-bottom:16px;}
  .modal .section-label{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin:18px 0 8px; font-weight:700;}
  .modal .section-label:first-of-type{margin-top:0;}
  .modal .text-block{
    font-size:13.5px; color:var(--text-dim); line-height:1.7; white-space:pre-wrap;
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px;
    max-height:260px; overflow-y:auto;
  }
  .modal .text-block:empty::after{content:"— пусто —"; color:var(--text-faint); font-style:italic;}
  .field-row{display:grid; grid-template-columns:110px 1fr; gap:10px; align-items:center; margin-bottom:8px;}
  .field-row label{font-size:12.5px; color:var(--text-dim);}
  input[type=text], .modal textarea{
    width:100%; background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:9px 12px; font-size:13px; font-family:inherit;
  }
  .modal textarea{resize:vertical; min-height:120px;}
  .modal .btnrow{display:flex; gap:10px; margin-top:20px;}
  .btn{
    padding:11px 18px; border:none; border-radius:var(--radius-sm); font-size:13.5px; font-weight:700;
    cursor:pointer; transition:filter .15s, transform .1s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(.99);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#0b0d12;}
  .btn-ghost{background:var(--panel-3); color:var(--text); border:1px solid var(--border);}
  .status-msg{font-size:12.5px; margin-top:12px; display:none;}
  .status-msg.show{display:block;}
  .status-ok{color:var(--ok);}
  .status-bad{color:var(--bad);}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">🎬</div>
    <div>
      <h1>Референсы — Filmway</h1>
      <div class="sub">Собранные Кадром референс-брифы</div>
    </div>
  </div>
  <div style="display:flex; gap:10px; align-items:center;">
    <a class="back" href="./approve.html" style="color:var(--text-dim); font-size:12.5px; text-decoration:none;">Согласование →</a>
    <a class="new-btn" href="./new.html">+ Новый бриф</a>
  </div>
</header>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">
  <span class="big">🎬</span>Пока нет ни одного брифа.<br>
  <a href="./new.html" style="color:var(--accent);">Собрать первый →</a>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const EDIT_URL = "https://purr-player-voice.ngrok-free.dev/edit";
const ALL_FIELDS = [
  ["camera", "Камера"], ["lens", "Оптика"], ["color", "Цвет"],
  ["light", "Свет"], ["mood", "Настроение"]
];
const STATUS_LABELS = {
  new: "новый", clarifying: "уточняется", pending_approval: "на согласовании",
  approved: "одобрено", revision: "нужны правки", sent: "отправлено"
};

let latestBriefs = [];

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  try {
    const res = await fetch('./data.json?_=' + Date.now(), {cache:'no-store'});
    const data = await res.json();
    const briefs = (data.briefs || []).slice().sort((a,b) => (b.updated_at||'').localeCompare(a.updated_at||''));
    latestBriefs = briefs;
    grid.innerHTML = '';
    if(!briefs.length){ empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    for(const b of briefs){
      const fields = b.fields || {};
      const links = b.links || {};
      const fieldsHtml = Object.entries(fields).filter(([k,v]) => v && k !== 'revision_note')
        .map(([k,v]) => `<div><b>${escapeHtml(k)}:</b> ${escapeHtml(v)}</div>`).join('');
      const linksHtml = Object.entries(links)
        .map(([k,v]) => `<a href="${v}" target="_blank" rel="noopener">${escapeHtml(k)} →</a>`).join('');
      const badgeClass = 'badge-' + (b.status || 'new');
      const badgeLabel = STATUS_LABELS[b.status] || b.status || '';
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${escapeHtml(b.title || b.slug)}</h3>
        <div class="meta"><span class="badge ${badgeClass}">${escapeHtml(badgeLabel)}</span>${escapeHtml(b.updated_at || '')}</div>
        <div class="fields">${fieldsHtml}</div>
        <div class="links">${linksHtml}</div>
        <div class="hint">Открыть и отредактировать →</div>
      `;
      card.querySelectorAll('.links a').forEach(a => a.addEventListener('click', e => e.stopPropagation()));
      card.addEventListener('click', () => openModal(b.slug));
      grid.appendChild(card);
    }
  } catch(e) {
    empty.style.display = 'block';
    empty.textContent = 'Ошибка загрузки: ' + e.message;
  }
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}

function openModal(slug){
  const b = latestBriefs.find(x => x.slug === slug);
  if(!b) return;
  renderView(b);
  document.getElementById('overlay').classList.add('show');
}

function renderView(b){
  const modal = document.getElementById('modal');
  const fields = b.fields || {};
  const links = b.links || {};
  const badgeClass = 'badge-' + (b.status || 'new');
  const badgeLabel = STATUS_LABELS[b.status] || b.status || '';
  const fieldsHtml = ALL_FIELDS.filter(([k]) => fields[k])
    .map(([k,label]) => `<div><b>${escapeHtml(label)}:</b> ${escapeHtml(fields[k])}</div>`).join('') || '<span style="color:var(--text-faint);font-style:italic;">— не заполнено —</span>';
  const linksHtml = Object.entries(links)
    .map(([k,v]) => `<a href="${v}" target="_blank" rel="noopener">${escapeHtml(k)} →</a>`).join('') || '<span style="color:var(--text-faint);font-style:italic;">— пока нет —</span>';

  modal.innerHTML = `
    <button class="close" id="closeBtn">✕</button>
    <h2>${escapeHtml(b.title || b.slug)}</h2>
    <div class="meta"><span class="badge ${badgeClass}">${escapeHtml(badgeLabel)}</span>${escapeHtml(b.slug)} · обновлено ${escapeHtml(b.updated_at || '')}</div>

    <div class="section-label">Текст брифа</div>
    <div class="text-block">${escapeHtml(b.text || '')}</div>

    <div class="section-label">Параметры</div>
    <div class="fields">${fieldsHtml}</div>

    <div class="section-label">Ссылки</div>
    <div class="links">${linksHtml}</div>

    <div class="btnrow">
      <button class="btn btn-primary" id="editBtn">✏️ Редактировать</button>
      <button class="btn btn-ghost" id="closeBtn2">Закрыть</button>
    </div>
  `;
  modal.querySelector('#closeBtn').addEventListener('click', closeModal);
  modal.querySelector('#closeBtn2').addEventListener('click', closeModal);
  modal.querySelector('#editBtn').addEventListener('click', () => renderEdit(b));
}

function renderEdit(b){
  const modal = document.getElementById('modal');
  const fields = b.fields || {};
  const fieldRows = ALL_FIELDS.map(([k,label]) => `
    <div class="field-row">
      <label for="f_${k}">${escapeHtml(label)}</label>
      <input type="text" id="f_${k}" value="${escapeHtml(fields[k] || '')}">
    </div>
  `).join('');

  modal.innerHTML = `
    <button class="close" id="closeBtn">✕</button>
    <h2>Редактировать: ${escapeHtml(b.title || b.slug)}</h2>
    <div class="meta">${escapeHtml(b.slug)}</div>

    <div class="section-label">Название</div>
    <input type="text" id="f_title" value="${escapeHtml(b.title || '')}">

    <div class="section-label">Текст брифа</div>
    <textarea id="f_text" rows="8">${escapeHtml(b.text || '')}</textarea>

    <div class="section-label">Параметры</div>
    ${fieldRows}

    <div class="btnrow">
      <button class="btn btn-primary" id="saveBtn">Сохранить правки</button>
      <button class="btn btn-ghost" id="cancelBtn">Отмена</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  `;
  modal.querySelector('#closeBtn').addEventListener('click', closeModal);
  modal.querySelector('#cancelBtn').addEventListener('click', () => renderView(b));

  modal.querySelector('#saveBtn').addEventListener('click', async () => {
    const saveBtn = modal.querySelector('#saveBtn');
    const cancelBtn = modal.querySelector('#cancelBtn');
    const statusMsg = modal.querySelector('#statusMsg');
    saveBtn.disabled = true; cancelBtn.disabled = true;
    statusMsg.className = 'status-msg show';
    statusMsg.textContent = 'Отправляю...';

    const payload = {
      slug: b.slug,
      title: modal.querySelector('#f_title').value.trim(),
      brief_text: modal.querySelector('#f_text').value.trim(),
      fields: {}
    };
    for(const [k] of ALL_FIELDS){
      payload.fields[k] = modal.querySelector('#f_' + k).value.trim();
    }

    try {
      const res = await fetch(EDIT_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      });
      const ct = res.headers.get('content-type') || '';
      if(!ct.includes('application/json')){
        throw new Error('сервер вернул не JSON (возможно, туннель ngrok не поднят) — HTTP ' + res.status);
      }
      const data = await res.json();
      if(!res.ok || !data.ok){ throw new Error(data.error || ('HTTP ' + res.status)); }
      statusMsg.className = 'status-msg show status-ok';
      statusMsg.textContent = '✅ Правки отправлены — Кадр применит их в течение минуты-двух.';
      saveBtn.textContent = 'Отправлено';
    } catch(e) {
      statusMsg.className = 'status-msg show status-bad';
      statusMsg.textContent = 'Не удалось отправить: ' + e.message;
      saveBtn.disabled = false; cancelBtn.disabled = false;
    }
  });
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeModal();
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
