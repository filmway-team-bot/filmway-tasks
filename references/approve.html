<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Согласование — Кадр</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#0b0d12; --panel:#12151c; --panel-2:#181c25; --panel-3:#1e232e;
    --border:#242938; --border-soft:#1b202b;
    --text:#eef0f5; --text-dim:#8b93a7; --text-faint:#565e72;
    --accent:#7c9bff; --accent-2:#a78bfa; --accent-dim:#1e2544;
    --ok:#3ecf8e; --ok-dim:#122e22; --bad:#f26d6d; --bad-dim:#2e1414;
    --radius:16px; --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(124,155,255,.08), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(167,139,250,.06), transparent 45%),
      var(--bg);
    color:var(--text); min-height:100vh;
  }
  header{
    padding:20px 32px; border-bottom:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .mark{
    width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:18px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 4px 18px rgba(124,155,255,.25);
  }
  header h1{font-size:16px; font-weight:700; margin:0; letter-spacing:-.01em;}
  header .sub{color:var(--text-dim); font-size:12.5px; margin-top:2px;}
  header a.back{color:var(--text-dim); font-size:12.5px; text-decoration:none;}
  header a.back:hover{color:var(--text);}

  .wrap{max-width:760px; margin:0 auto; padding:32px 24px 80px;}
  .card{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:22px 24px; margin-bottom:18px;}
  .card h3{margin:0 0 6px; font-size:16px; font-weight:700;}
  .meta{color:var(--text-faint); font-size:11.5px; margin-bottom:12px;}
  .fields{font-size:13px; color:var(--text-dim); line-height:1.75; margin-bottom:12px;}
  .fields b{color:var(--text);}
  .miro-cta{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:var(--accent-dim); border:1px solid var(--accent); border-radius:var(--radius-sm);
    padding:14px 16px; margin-bottom:12px;
  }
  .miro-cta .txt{font-size:13px; color:var(--text-dim);}
  .miro-cta a.btn{
    flex-shrink:0; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#0b0d12;
    text-decoration:none; font-size:13px; font-weight:700; padding:9px 15px; border-radius:8px;
  }
  .no-miro{font-size:12.5px; color:var(--text-faint); margin-bottom:12px; font-style:italic;}
  .links{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .links a{font-size:12px; color:var(--accent); text-decoration:none; border:1px solid #2a3550; padding:5px 11px; border-radius:8px;}
  .links a:hover{background:var(--accent-dim);}
  textarea{
    width:100%; background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; font-family:inherit;
    resize:vertical; min-height:56px; margin-bottom:12px;
  }
  .actions{display:flex; gap:10px;}
  .btn{
    flex:1; padding:12px; border:none; border-radius:var(--radius-sm); font-size:13.5px; font-weight:700;
    cursor:pointer; transition:filter .15s, transform .1s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(.99);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-ok{background:linear-gradient(135deg, var(--ok), #2fae76); color:#08150f;}
  .btn-bad{background:var(--panel-3); color:var(--text); border:1px solid var(--border);}
  .status-msg{font-size:12.5px; margin-top:10px; display:none;}
  .status-msg.show{display:block;}
  .status-ok{color:var(--ok);}
  .status-bad{color:var(--bad);}
  .empty{color:var(--text-faint); text-align:center; margin-top:100px; font-size:14px; line-height:1.8;}
  .empty .big{font-size:36px; display:block; margin-bottom:14px; opacity:.5;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">✅</div>
    <div>
      <h1>Согласование — Кадр</h1>
      <div class="sub">Референсы, ожидающие решения Эраджа</div>
    </div>
  </div>
  <a class="back" href="./index.html">← Все референсы</a>
</header>

<div class="wrap" id="wrap"></div>
<div class="empty" id="empty" style="display:none">
  <span class="big">✅</span>Нечего согласовывать — все брифы разобраны.
</div>

<script>
const APPROVE_URL = "https://purr-player-voice.ngrok-free.dev/approve";

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load(){
  const wrap = document.getElementById('wrap');
  const empty = document.getElementById('empty');
  wrap.innerHTML = '';
  try {
    const res = await fetch('./data.json?_=' + Date.now(), {cache:'no-store'});
    const data = await res.json();
    const briefs = (data.briefs || [])
      .filter(b => b.status === 'pending_approval')
      .sort((a,b) => (a.updated_at||'').localeCompare(b.updated_at||''));
    if(!briefs.length){ empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    for(const b of briefs){ wrap.appendChild(renderCard(b)); }
  } catch(e) {
    empty.style.display = 'block';
    empty.textContent = 'Ошибка загрузки: ' + e.message;
  }
}

function renderCard(b){
  const fields = b.fields || {};
  const links = b.links || {};
  const fieldsHtml = Object.entries(fields).filter(([k,v]) => v && k !== 'revision_note')
    .map(([k,v]) => `<div><b>${escapeHtml(k)}:</b> ${escapeHtml(v)}</div>`).join('');
  const otherLinksHtml = Object.entries(links).filter(([k]) => k !== 'miro')
    .map(([k,v]) => `<a href="${v}" target="_blank" rel="noopener">${escapeHtml(k)} →</a>`).join('');

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${escapeHtml(b.title || b.slug)}</h3>
    <div class="meta">${escapeHtml(b.slug)} · обновлено ${escapeHtml(b.updated_at || '')}</div>
    <div class="fields">${fieldsHtml}</div>
    ${links.miro
      ? `<div class="miro-cta"><div class="txt">Фото собраны на доске Miro</div><a class="btn" href="${links.miro}" target="_blank" rel="noopener">Открыть доску →</a></div>`
      : `<div class="no-miro">Фото ещё не подтянулись в Miro — можно посмотреть ссылки ниже или подождать.</div>`}
    <div class="links">${otherLinksHtml}</div>
    <textarea placeholder="Комментарий (необязательно, видно в поле «Нужны правки»)"></textarea>
    <div class="actions">
      <button class="btn btn-ok" data-decision="approved">✅ Одобрить</button>
      <button class="btn btn-bad" data-decision="revision">✏️ Нужны правки</button>
    </div>
    <div class="status-msg"></div>
  `;

  const textarea = card.querySelector('textarea');
  const statusMsg = card.querySelector('.status-msg');
  const buttons = card.querySelectorAll('.btn');

  buttons.forEach(btn => {
    btn.addEventListener('click', async () => {
      buttons.forEach(x => x.disabled = true);
      statusMsg.className = 'status-msg show';
      statusMsg.textContent = 'Отправляю...';
      try {
        const res = await fetch(APPROVE_URL, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: JSON.stringify({slug: b.slug, decision: btn.dataset.decision, note: textarea.value.trim()})
        });
        const ct = res.headers.get('content-type') || '';
        if(!ct.includes('application/json')){
          throw new Error('сервер вернул не JSON (возможно, туннель ngrok не поднят) — HTTP ' + res.status);
        }
        const data = await res.json();
        if(!res.ok || !data.ok){ throw new Error(data.error || ('HTTP ' + res.status)); }
        statusMsg.className = 'status-msg show status-ok';
        statusMsg.textContent = btn.dataset.decision === 'approved'
          ? '✅ Одобрено — Кадр заберёт решение в течение минуты.'
          : '✏️ Отправлено на доработку — Кадр заберёт решение в течение минуты.';
        setTimeout(() => { card.style.opacity = '.4'; }, 300);
      } catch(e) {
        statusMsg.className = 'status-msg show status-bad';
        statusMsg.textContent = 'Не удалось отправить: ' + e.message;
        buttons.forEach(x => x.disabled = false);
      }
    });
  });

  return card;
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
